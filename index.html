<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maktab Test Platformasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="#" class="logo">
            <span>🏫 IT School Tests</span>
        </a>
    </header>

    <main>
        <h1>Bilimingizni sinab ko'ring</h1>

        <div class="section-title">Sinfni tanlang:</div>
        <div class="class-selector">
            <button class="class-btn" onclick="selectClass(5)">5-Sinf</button>
            <button class="class-btn" onclick="selectClass(6)">6-Sinf</button>
            <button class="class-btn" onclick="selectClass(7)">7-Sinf</button>
            <button class="class-btn" onclick="selectClass(8)">8-Sinf</button>
            <button class="class-btn" onclick="selectClass(9)">9-Sinf</button>
            <button class="class-btn" onclick="selectClass(10)">10-Sinf</button>
            <button class="class-btn" onclick="selectClass(11)">11-Sinf</button>
        </div>

        <div id="filtersSection" class="filters-wrapper hidden">
            
            <div class="filter-group">
                <div class="selector-label">Til:</div>
                <div class="language-selector">
                    <button class="lang-btn active" onclick="selectLanguage('uz')">O'zbek</button>
                    <button class="lang-btn" onclick="selectLanguage('qr')">Qaraqalpaq</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="selector-label">Chorak:</div>
                <div class="quarter-selector">
                    <button class="quarter-btn active" onclick="selectQuarter(1)">I</button>
                    <button class="quarter-btn" onclick="selectQuarter(2)">II</button>
                    <button class="quarter-btn" onclick="selectQuarter(3)">III</button>
                    <button class="quarter-btn" onclick="selectQuarter(4)">IV</button>
                </div>
            </div>

        </div>

        <div id="topicsContainer" class="topics-container">
            <p class="empty-msg">Mavzularni ko'rish uchun yuqoridagi sinflardan birini tanlang.</p>
        </div>
    </main>

    <footer>
        &copy; 2025 IT Maktab. Barcha huquqlar himoyalangan.
    </footer>

    <script src="script.js"></script>
</body>
</html>
